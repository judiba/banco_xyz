services:
  backend:
    build:
      context: ./backend
    container_name: banco_xyz_backend
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: banco_xyz_frontend
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
