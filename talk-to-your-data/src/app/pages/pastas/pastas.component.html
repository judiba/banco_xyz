
<!-- PASTAS PAGE: container principal -->
<div class="page">
  <div class="container">
    <!-- HEADER: título + CTA criar pasta -->
    <header class="header" aria-label="Cabeçalho de Pastas">
      <div class="title">
        <img
          class="title__icon"
          src="/assets/pasta.svg"
          alt=""
          aria-hidden="true"
          width="18"
          height="18"
        />
        <h1 class="title__text">Pastas</h1>
      </div>

      <button
        class="btn btn--ghost btn--with-icon"
        type="button"
        (click)="createFolder()"
      >
        <span class="btn__plus" aria-hidden="true">+</span>
        Criar pasta
      </button>
    </header>

    <!-- SEARCH: filtro por nome da pasta -->
    <div class="search">
      <div class="search__box" role="search" aria-label="Buscar pastas">
        <input
          class="search__input"
          type="text"
          placeholder="Buscar pastas..."
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          aria-label="Buscar pastas"
        />
      </div>
    </div>

    <!-- GRID: lista de pastas (cards) -->
    <section class="grid" aria-label="Lista de pastas" role="list">
      <div
        class="card"
        [class.card--menu-open]="isFolderMenuOpen(f.id)"
        role="listitem"
        tabindex="0"
        *ngFor="let f of filteredFolders()"
        (click)="openFolder(f)"
        (keydown.enter)="openFolder(f)"
        (keydown.space)="openFolder(f); $event.preventDefault()"
      >
        <div class="card__top">
          <div class="card__icon" aria-hidden="true"></div>

          <!-- MENU: dropdown de ações da pasta (renomear/excluir) -->
          <div class="card__menu-wrap" (click)="$event.stopPropagation()">
            <button
              class="card__menu"
              type="button"
              aria-label="Opções da pasta"
              [attr.aria-expanded]="isFolderMenuOpen(f.id)"
              aria-haspopup="menu"
              (click)="toggleFolderMenu(f.id, $event)"
              (keydown.escape)="closeFolderMenu()"
            >
              <img
                class="card__menu-icon"
                src="/assets/3p.svg"
                alt=""
                aria-hidden="true"
                width="16"
                height="16"
              />
            </button>

            <div
              class="card__dropdown"
              *ngIf="isFolderMenuOpen(f.id)"
              role="menu"
              aria-label="Menu da pasta"
            >
              <button
                class="card__dropdown-item"
                type="button"
                role="menuitem"
                (click)="openRenameFolderModal(f, $event)"
              >
                <span
                  class="card__dropdown-icon card__dropdown-icon--edit"
                  aria-hidden="true"
                ></span>
                <span class="card__dropdown-text">Renomear pasta</span>
              </button>

              <div class="card__dropdown-separator" aria-hidden="true"></div>

              <button
                class="card__dropdown-item card__dropdown-item--danger"
                type="button"
                role="menuitem"
                (click)="confirmDeleteFolder(f, $event)"
              >
                <span
                  class="card__dropdown-icon card__dropdown-icon--trash"
                  aria-hidden="true"
                ></span>
                <span class="card__dropdown-text">Excluir pasta</span>
              </button>
            </div>
          </div>
        </div>

        <div class="card__name">{{ f.name }}</div>
        <div class="card__meta">{{ f.conversationsCount }} conversas</div>
      </div>

      <!-- EMPTY STATE: nada encontrado no filtro -->
      <div class="empty" *ngIf="searchQuery().trim() && filteredFolders().length === 0">
        Nenhum resultado encontrado
      </div>
    </section>
  </div>

  <!-- MODAL: renomear pasta -->
  <div
    class="modal-overlay"
    *ngIf="isRenameFolderModalOpen()"
    (click)="closeRenameFolderModal()"
    role="presentation"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Renomear pasta"
      (click)="$event.stopPropagation()"
    >
      <header class="modal__header">
        <h2 class="modal__title">Renomear pasta</h2>

        <button
          class="modal__close"
          type="button"
          aria-label="Fechar"
          (click)="closeRenameFolderModal()"
        >
          ×
        </button>
      </header>

      <form class="modal__body" (ngSubmit)="submitRenameFolder()">
        <label class="modal__label" for="rename-folder-name">Nome da pasta</label>

        <input
          #renameFolderInput
          id="rename-folder-name"
          class="modal__input"
          type="text"
          placeholder="Informe o nome da pasta"
          [ngModel]="renameFolderName()"
          (ngModelChange)="renameFolderName.set($event); renameFolderError.set(null)"
          name="renameFolderName"
          autocomplete="off"
        />

        <div class="modal__error" *ngIf="renameFolderError()">
          {{ renameFolderError() }}
        </div>

        <footer class="modal__footer">
          <button
            class="modal__submit"
            type="submit"
            [disabled]="!renameFolderName().trim()"
          >
            Salvar
          </button>
        </footer>
      </form>
    </div>
  </div>

  <!-- MODAL: criar pasta -->
  <div
    class="modal-overlay"
    *ngIf="isCreateFolderModalOpen()"
    (click)="closeCreateFolderModal()"
    role="presentation"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Criar pasta"
      (click)="$event.stopPropagation()"
    >
      <header class="modal__header">
        <h2 class="modal__title">Criar pasta</h2>

        <button
          class="modal__close"
          type="button"
          aria-label="Fechar"
          (click)="closeCreateFolderModal()"
        >
          ×
        </button>
      </header>

      <form class="modal__body" (ngSubmit)="submitCreateFolder()">
        <label class="modal__label" for="new-folder-name">Nome da pasta</label>

        <input
          #createFolderInput
          id="new-folder-name"
          class="modal__input"
          type="text"
          placeholder="Informe o nome da pasta"
          [ngModel]="newFolderName()"
          (ngModelChange)="newFolderName.set($event); createFolderError.set(null)"
          name="newFolderName"
          autocomplete="off"
        />

        <div class="modal__error" *ngIf="createFolderError()">
          {{ createFolderError() }}
        </div>

        <div class="modal__info" *ngIf="showCreateFolderInfo()">
          <img
            class="modal__info-icon"
            src="/assets/infoa.svg"
            alt=""
            aria-hidden="true"
            width="18"
            height="18"
          />
          <p class="modal__info-text">
            Os arquivos mantêm chats em um só lugar. Use-os para trabalhos em
            andamento ou apenas para manter as coisas organizadas.
          </p>

        </div>

        <footer class="modal__footer">
          <button
            class="modal__submit"
            type="submit"
            [disabled]="!newFolderName().trim()"
          >
            Criar pasta
          </button>
        </footer>
      </form>
    </div>
  </div>
</div>
