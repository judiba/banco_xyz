services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    container_name: ttyd-backend
    environment:
      APP_ENV: prod
    ports:
      - "8000:8000"

  swagger:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    container_name: ttyd-swagger
    command: poetry run uvicorn backend.swagger_app:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    depends_on:
      - backend
